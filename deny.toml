# cargo-deny policy.
#
# Enforced in CI (`deny` workflow) so a new dependency cannot silently
# introduce a copyleft license, a known CVE, or a duplicate version. Operators
# that require an SBOM or a license audit can point at this file as the source
# of truth for what the dependency policy is.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
# Fail on any known vulnerability. `cargo deny check advisories` consults the
# RustSec database.
version = 2
yanked = "deny"

[licenses]
version = 2
# The project is MIT. Allow the permissive licenses that make up the Rust
# ecosystem; anything copyleft (GPL/AGPL) must be a deliberate, reviewed
# addition.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
# ring is a mixed Apache-2.0 / ISC / MIT-0 license that the scanner cannot
# express from the SPDX text alone.
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# RocksDB and Arrow are the heavy native deps; keep exactly one copy each.
deny = [
    { name = "openssl-sys", reason = "we use rustls, not OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
