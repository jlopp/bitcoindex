# Scale serve on CPU. Request handling is CPU-bound on JSON rendering and
# connection handling; ClickHouse latency shows up as in-flight requests, not
# CPU — see optional/hpa-inflight.yaml to scale on that instead/as well.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bidx-serve
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bidx-serve
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
