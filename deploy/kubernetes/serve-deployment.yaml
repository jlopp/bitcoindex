apiVersion: apps/v1
kind: Deployment
metadata:
  name: bidx-serve
  labels:
    app.kubernetes.io/name: bidx-serve
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: bidx-serve
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bidx-serve
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/path: /metrics
    spec:
      # drain_delay_secs (5) + shutdown_timeout_secs (25) + margin.
      terminationGracePeriodSeconds: 40
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bidx-serve
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bidx-serve
      containers:
        - name: serve
          image: ghcr.io/jlopp/bitcoindex
          args: ["serve", "--config", "/etc/bidx/bidx.toml"]
          ports:
            - name: http
              containerPort: 8432
            - name: metrics
              containerPort: 9101
          env:
            - name: BIDX_CLICKHOUSE__PASSWORD
              valueFrom:
                secretKeyRef: { name: bidx-secrets, key: BIDX_CLICKHOUSE__PASSWORD }
            - name: BIDX_AUTH__KEYS
              valueFrom:
                secretKeyRef: { name: bidx-secrets, key: BIDX_AUTH__KEYS, optional: true }
          readinessProbe:
            # 503 until ClickHouse answers and the index has a tip, and again
            # from SIGTERM onward so endpoints drain before the pod stops.
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 1
            failureThreshold: 30
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              # Headroom for the response cache (cache.max_entries).
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/bidx
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: bidx-config
            items:
              - key: bidx.toml
                path: bidx.toml
