# Example only — do NOT commit real values. Create it from your secret
# manager instead (External Secrets, Sealed Secrets, SOPS, Vault...), e.g.:
#
#   kubectl -n bitcoindex create secret generic bidx-secrets \
#     --from-literal=BIDX_CLICKHOUSE__PASSWORD=... \
#     --from-literal=BIDX_AUTH__KEYS='acme:tok_live_abc:200:400,internal:tok_int_xyz'
#
# BIDX_AUTH__KEYS is `name:token[:rps[:burst]]`, comma-separated. The name is
# the metrics label (bidx_tenant_requests_total{tenant="acme"}). rps 0 or
# omitted = unlimited. To avoid plaintext tokens, configure keys in the TOML
# with `token_sha256` instead.
apiVersion: v1
kind: Secret
metadata:
  name: bidx-secrets
  namespace: bitcoindex
type: Opaque
stringData:
  # Read-only user for the serve pods.
  BIDX_CLICKHOUSE__PASSWORD: change-me
  BIDX_AUTH__KEYS: ""
  # Writer credentials for the ingest StatefulSet (insert on the bitcoin db).
  INGEST_CLICKHOUSE_USER: bidx_writer
  INGEST_CLICKHOUSE_PASSWORD: change-me-too
  BIDX_NODE__USER: bitcoinrpc
  BIDX_NODE__PASSWORD: change-me-three
