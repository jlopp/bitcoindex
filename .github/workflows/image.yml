name: Container image

# Publish a multi-arch (linux/amd64 + linux/arm64) image to GHCR:
#   * every push to master        → ghcr.io/<owner>/bitcoindex:edge, :sha-<short>
#   * every `v*` tag (e.g. v1.2.3) → :1.2.3, :1.2, :1, :latest
# Each architecture builds natively on its own runner (no QEMU — RocksDB under
# emulation takes hours), is pushed by digest, and the digests are merged into
# one manifest list. The result carries SLSA provenance + an SBOM attestation
# and is signed keyless with cosign (GitHub OIDC), so operators can verify:
#
#   cosign verify ghcr.io/<owner>/bitcoindex:<tag> \
#     --certificate-identity-regexp 'https://github.com/<owner>/bitcoindex/.github/workflows/image.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
    paths:
      - Dockerfile
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase owner)
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (labels only; tags are applied at merge)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}

      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: >-
            ${{ github.event_name == 'pull_request'
                && 'type=cacheonly'
                || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.image) }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless signing
      attestations: write   # build provenance
    steps:
      - name: Image name (lowercase owner)
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=edge,branch=master
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.name.outputs.image }}@sha256:%s ' *)

      - name: Resolve manifest digest
        id: digest
        run: |
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.name.outputs.image }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # The action defaults this to true, and on a `v*` tag push it then
          # tries to attach the SBOM to the GitHub release. That needs
          # `contents: write`, which this job deliberately does not have (it
          # only needs `packages: write` to push the image), so the upload
          # fails with "Resource not accessible by integration". The release's
          # SBOM is already produced and attached by release.yml (CycloneDX),
          # and the attestation below still uses the local sbom.spdx.json, so
          # skip the release attach rather than widen this job's permissions.
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign (keyless)
        run: cosign sign --yes "${{ steps.name.outputs.image }}@${{ steps.digest.outputs.digest }}"
