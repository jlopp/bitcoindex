name: Deny

# Supply-chain gate: known advisories, license policy, and duplicate/unknown
# sources. Runs on every PR so a bad dependency is caught at review time.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - name: Check advisories, licenses, bans, sources
        run: cargo deny check
